<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Folder Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0f1115; color: #e8eaf0;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
  header { margin-bottom: 24px; }
  header h1 { font-size: 26px; font-weight: 700; }
  header p { color: #8b93a5; margin-top: 4px; font-size: 14px; }

  .card-form {
    background: #171a21; border: 1px solid #262b36; border-radius: 14px;
    padding: 16px; margin-bottom: 4px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1; min-width: 200px;
    background: #0f1115; border: 1px solid #2c3342; color: #e8eaf0;
    border-radius: 9px; padding: 10px 12px; font-size: 14px; outline: none;
  }
  input[type="text"]:focus { border-color: #4f8cff; }
  input::placeholder { color: #5c6474; }
  button {
    border: none; border-radius: 9px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: #232838; color: #e8eaf0; transition: background .15s;
  }
  button:hover { background: #2c3348; }
  button:disabled { opacity: .5; cursor: wait; }
  .btn-primary { background: #4f8cff; color: #fff; }
  .btn-primary:hover { background: #3f7bef; }

  .toolbar { display: flex; gap: 8px; margin: 16px 0; }
  #searchInput { flex: 1; min-width: 160px; }
  .toolbar button { white-space: nowrap; }

  #modalOverlay {
    position: fixed; inset: 0; background: rgba(5,8,14,.65);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #modalOverlay.show { display: flex; }
  .modal {
    background: #171a21; border: 1px solid #2c3342; border-radius: 14px;
    padding: 22px; max-width: 440px; width: calc(100% - 40px);
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .modal h3 { font-size: 17px; margin-bottom: 6px; }
  .modal p { color: #8b93a5; font-size: 14px; margin-bottom: 16px; }
  .modal .row2 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .folder-card {
    background: #171a21; border: 1px solid #262b36; border-radius: 14px;
    padding: 14px; cursor: pointer; position: relative;
    transition: transform .12s, border-color .12s;
  }
  .folder-card:hover { transform: translateY(-2px); border-color: #4f8cff; }
  .folder-card .icon { font-size: 26px; }
  .folder-card .name {
    font-weight: 600; margin-top: 6px; font-size: 15px; padding-right: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .folder-card .path {
    font-family: Consolas, monospace; font-size: 12px; color: #8b93a5;
    margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .folder-card .actions { display: flex; gap: 6px; margin-top: 10px; }
  .folder-card .actions button { padding: 5px 10px; font-size: 12px; }
  .badge {
    position: absolute; top: 14px; right: 14px;
    width: 9px; height: 9px; border-radius: 50%;
  }
  .badge.ok { background: #3ecf8e; }
  .badge.missing { background: #ff5f56; }

  #emptyState { text-align: center; color: #8b93a5; padding: 60px 0; }
  #emptyState .big { font-size: 44px; margin-bottom: 12px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #232838; border: 1px solid #2c3342; color: #e8eaf0;
    padding: 10px 18px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: #ff5f56; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📁 Folder Launcher</h1>
    <p>Klik mana-mana kad folder untuk membukanya dalam Windows Explorer.</p>
  </header>

  <div class="card-form">
    <div class="row">
      <input type="text" id="pathInput" placeholder="Tampal path folder, cth: C:\Users\yusuf\Documents" />
      <button type="button" id="browseBtn">📂 Pilih folder…</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="nameInput" placeholder="Nama pilihan (cth: Kerja)" style="flex:0 1 260px" />
      <button type="button" class="btn-primary" id="addBtn">+ Tambah</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Cari folder…" />
    <button type="button" id="exportBtn">📤 Eksport</button>
    <button type="button" id="importBtn">📥 Import</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden />
  </div>

  <div id="grid"></div>
  <div id="emptyState" hidden>
    <div class="big">🗂️</div>
    <div class="msg"></div>
  </div>
</div>
<div id="toast"></div>
<div id="modalOverlay">
  <div class="modal">
    <h3>📥 Import folder</h3>
    <p id="importInfo"></p>
    <div class="row2">
      <button type="button" id="importCancel">Batal</button>
      <button type="button" id="importMerge">➕ Gabung</button>
      <button type="button" class="btn-primary" id="importReplace">♻️ Ganti semua</button>
    </div>
  </div>
</div>

<script>
const HDR = { "Content-Type": "application/json", "X-App": "folder-launcher" };
let items = [];

const $ = (id) => document.getElementById(id);

function toast(msg, isError = false) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: HDR, ...opts });
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

async function refresh() {
  try { items = await api("/api/paths"); }
  catch (e) { toast("Gagal muat senarai: " + e.message, true); items = []; }
  render();
}

function render() {
  const q = $("searchInput").value.trim().toLowerCase();
  const list = items.filter(it =>
    !q || it.name.toLowerCase().includes(q) || it.path.toLowerCase().includes(q));
  const grid = $("grid");
  grid.innerHTML = "";

  const emptyEl = $("emptyState");
  if (items.length === 0) {
    emptyEl.hidden = false;
    emptyEl.querySelector(".msg").textContent = "Tiada folder lagi. Tambah folder pertama anda di atas!";
  } else if (list.length === 0) {
    emptyEl.hidden = false;
    emptyEl.querySelector(".msg").textContent = "Tiada padanan untuk carian \"" + q + "\".";
  } else {
    emptyEl.hidden = true;
  }

  for (const it of list) {
    const card = document.createElement("div");
    card.className = "folder-card";
    card.innerHTML = `
      <span class="badge ${it.exists ? "ok" : "missing"}" title="${it.exists ? "Folder wujud" : "Folder tidak dijumpai"}"></span>
      <div class="icon">📁</div>
      <div class="name"></div>
      <div class="path"></div>
      <div class="actions">
        <button data-act="copy">📋 Salin</button>
        <button data-act="delete">🗑️ Buang</button>
      </div>`;
    card.querySelector(".name").textContent = it.name;
    const pathEl = card.querySelector(".path");
    pathEl.textContent = it.path;
    pathEl.title = it.path;
    card.addEventListener("click", () => openFolder(it));
    card.querySelector('[data-act="copy"]').addEventListener("click", (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(it.path).then(() => toast("Path disalin!"));
    });
    card.querySelector('[data-act="delete"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("Buang \"" + it.name + "\" dari senarai?")) return;
      try {
        await api("/api/paths/" + it.id, { method: "DELETE" });
        toast("Dibuang.");
        refresh();
      } catch (err) { toast(err.message, true); }
    });
    grid.appendChild(card);
  }
}

async function openFolder(it) {
  toast("Membuka \"" + it.name + "\"…");
  try {
    await api("/api/open", { method: "POST", body: JSON.stringify({ id: it.id }) });
  } catch (e) { toast(e.message, true); }
}

async function addFolder() {
  const path = $("pathInput").value.trim();
  if (!path) { toast("Masukkan path folder dahulu.", true); return; }
  try {
    const r = await api("/api/paths", {
      method: "POST",
      body: JSON.stringify({ path, name: $("nameInput").value.trim() }),
    });
    $("pathInput").value = "";
    $("nameInput").value = "";
    toast(r.already ? "Folder sudah ada dalam senarai." : "Folder ditambah!");
    refresh();
  } catch (e) { toast(e.message, true); }
}

async function pickFolder() {
  $("browseBtn").disabled = true;
  toast("Pilih folder dalam dialog Windows…");
  try {
    const r = await api("/api/pick", { method: "POST", body: "{}" });
    if (r.path) { $("pathInput").value = r.path; $("nameInput").focus(); }
    else { toast("Tiada folder dipilih."); }
  } catch (e) { toast(e.message, true); }
  $("browseBtn").disabled = false;
}

$("addBtn").addEventListener("click", addFolder);
$("pathInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addFolder(); });
$("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addFolder(); });
$("browseBtn").addEventListener("click", pickFolder);
$("searchInput").addEventListener("input", render);

let pendingImport = null;

async function exportList() {
  try {
    const list = await api("/api/paths");
    const data = list.map(({ id, name, path }) => ({ id, name, path }));
    const payload = { app: "folder-launcher", exported: new Date().toISOString(), items: data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "folder-launcher-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast(data.length + " folder dieksport.");
  } catch (e) { toast(e.message, true); }
}

function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch (e) { toast("Fail bukan JSON yang sah.", true); return; }
    const items = Array.isArray(parsed) ? parsed : (parsed && parsed.items);
    if (!Array.isArray(items) || items.length === 0) {
      toast("Tiada senarai folder dijumpai dalam fail itu.", true);
      return;
    }
    pendingImport = items;
    $("importInfo").textContent = "Fail mengandungi " + items.length + " entri. Pilih cara import:";
    $("modalOverlay").classList.add("show");
  };
  reader.onerror = () => toast("Gagal membaca fail.", true);
  reader.readAsText(file);
}

async function doImport(mode) {
  if (!pendingImport) return;
  const items = pendingImport;
  pendingImport = null;
  $("modalOverlay").classList.remove("show");
  try {
    const r = await api("/api/import", {
      method: "POST",
      body: JSON.stringify({ items, mode }),
    });
    let msg = r.imported + " folder diimport";
    if (r.skipped) msg += ", " + r.skipped + " sudah wujud";
    if (r.invalid) msg += ", " + r.invalid + " tidak sah";
    toast(msg + ".");
    refresh();
  } catch (e) { toast(e.message, true); }
}

function closeImportModal() {
  pendingImport = null;
  $("modalOverlay").classList.remove("show");
}

$("exportBtn").addEventListener("click", exportList);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", (e) => {
  if (e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]);
  e.target.value = "";  // reset supaya fail yang sama boleh dipilih semula
});
$("importMerge").addEventListener("click", () => doImport("merge"));
$("importReplace").addEventListener("click", () => doImport("replace"));
$("importCancel").addEventListener("click", closeImportModal);
$("modalOverlay").addEventListener("click", (e) => { if (e.target === $("modalOverlay")) closeImportModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("modalOverlay").classList.contains("show")) closeImportModal();
});

refresh();
</script>
</body>
</html>
